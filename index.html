<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Art Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ffd700;
            margin-bottom: 10px;
        }
        p {
            color: #b0b0b0;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 10px;
        }
        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .gallery img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 15px rgba(255,215,0,0.2);
        }
    </style>
</head>
<body>

    <h1>Mark Art Gallery</h1>
    <p>Akvareli i izkustvo</p>

    <div class="gallery">
        <!-- Tuka moje da dobavyash ili veche izpolzvash snimkite si -->
    </div>

    <!-- Skript za otvaryane na kartinite na cyal ekran (Lightbox) -->
    <script>
      document.querySelectorAll('img').forEach(image => {
        image.onclick = () => {
          const modal = document.createElement('div');
          modal.style.position = 'fixed';
          modal.style.top = '0';
          modal.style.left = '0';
          modal.style.width = '100vw';
          modal.style.height = '100vh';
          modal.style.backgroundColor = 'rgba(0,0,0,0.85)';
          modal.style.display = 'flex';
          modal.style.alignItems = 'center';
          modal.style.justifyContent = 'center';
          modal.style.zIndex = '10000';
          modal.style.cursor = 'pointer';

          const img = document.createElement('img');
          img.src = image.src;
          img.style.maxWidth = '90%';
          img.style.maxHeight = '90%';
          img.style.borderRadius = '8px';
          img.style.boxShadow = '0 0 20px rgba(255,255,255,0.2)';

          modal.appendChild(img);
          document.body.appendChild(modal);

          modal.onclick = () => modal.remove();
        };
      });
    </script>

</body>
</html>
